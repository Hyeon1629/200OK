<?xml version="1.0" encoding="UTF-8"?>
<!--
    체크당 런처 아이콘 — 확정 시안 원본 (참조용 보관).
    실제 Android 빌드에는 res/drawable/ic_launcher_*.xml (vector drawable) 가 사용된다.
    시안 변경 시 본 SVG 와 vector drawable 양쪽을 동시에 갱신할 것.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">

    <defs>
        <linearGradient id="dropletGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#66BB6A" />
            <stop offset="100%" stop-color="#388E3C" />
        </linearGradient>
    </defs>

    <!-- 1. 배경: 둥근 사각형 (radius 96), Material Green 50 -->
    <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="#F1F8E9" />

    <!-- 2. 물방울 본체: 수직 그라데이션 -->
    <path
        d="M 256 100
           C 320 180, 376 230, 376 290
           A 120 120 0 1 1 136 290
           C 136 230, 192 180, 256 100 Z"
        fill="url(#dropletGradient)" />

    <!-- 3. 좌상단 광택: 회전 -32° 의 흰색 타원, opacity 0.35 -->
    <ellipse
        cx="212" cy="218" rx="26" ry="14"
        fill="#FFFFFF" fill-opacity="0.35"
        transform="rotate(-32 212 218)" />

    <!-- 4. 체크 표시: 흰색 stroke, 둥근 끝 -->
    <path
        d="M 214 296 L 246 330 L 304 268"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="22"
        stroke-linecap="round"
        stroke-linejoin="round" />

</svg>
