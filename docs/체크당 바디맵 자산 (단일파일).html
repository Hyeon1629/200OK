document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html lang=\"ko\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>체크당 바디맵 · 고정 인체 자산 (재디자인 금지)<\u002Ftitle>\n<style>\n  :root{\n    --bg:#EEF1F4; --card:#FFFFFF; --ink:#1B2126; --ink2:#5B6670; --ink3:#8A949D;\n    --line:#E4E8EC; --line2:#EFF2F5; --green:#4CAF50; --green-d:#2E7D32;\n    --warn:#B5460F; --warn-bg:#FFF4EC; --warn-line:#F3C9A8;\n    --radius:18px; --shadow:0 1px 2px rgba(20,30,40,.04),0 8px 26px rgba(20,30,40,.06);\n  }\n  *{box-sizing:border-box;}\n  html,body{margin:0;}\n  body{font-family:\"Pretendard Variable\",Pretendard,-apple-system,system-ui,sans-serif; background:var(--bg); color:var(--ink); line-height:1.55; -webkit-font-smoothing:antialiased; padding:32px 28px 90px;}\n  .wrap{max-width:1080px; margin:0 auto;}\n  a{color:inherit;}\n\n  header.top{display:flex; align-items:center; gap:14px; margin-bottom:20px;}\n  .lock{width:46px;height:46px;border-radius:13px;background:var(--green-d);display:grid;place-items:center;flex:none;box-shadow:0 5px 14px rgba(46,125,50,.35);}\n  .lock svg{width:24px;height:24px;}\n  h1{font-size:21px; font-weight:800; margin:0; letter-spacing:-.02em;}\n  .sub{font-size:13.5px; color:var(--ink2); margin-top:3px;}\n\n  .banner{background:var(--warn-bg); border:1px solid var(--warn-line); border-radius:14px; padding:16px 18px; margin-bottom:24px;}\n  .banner h2{font-size:14.5px; font-weight:800; color:var(--warn); margin:0 0 8px; display:flex; align-items:center; gap:8px;}\n  .banner ul{margin:0; padding-left:20px; font-size:13.5px; color:#7A4524;}\n  .banner li{margin:3px 0;}\n  .banner li b{color:var(--warn);}\n\n  .cards{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:24px;}\n  @media(max-width:760px){ .cards{grid-template-columns:1fr;} }\n  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px;}\n  .card h3{font-size:14px; font-weight:800; margin:0 0 4px; display:flex; align-items:center; justify-content:space-between;}\n  .card .meta{font-size:11.5px; color:var(--ink3); font-weight:600;}\n  .stage{margin:12px 0 6px; border-radius:12px; padding:10px; display:grid; place-items:center;\n    background:\n      linear-gradient(45deg,#EAEDF0 25%,transparent 25%,transparent 75%,#EAEDF0 75%) 0 0/18px 18px,\n      linear-gradient(45deg,#EAEDF0 25%,#F6F8FA 25%,#F6F8FA 75%,#EAEDF0 75%) 9px 9px/18px 18px;\n    border:1px solid var(--line2);}\n  svg.body{width:auto; height:420px; display:block; overflow:visible;}\n  svg.body .hitline{fill:none; stroke:#E0603A; stroke-width:1; stroke-dasharray:3 3; opacity:0; transition:.15s;}\n  svg.body.show .hitline{opacity:.9;}\n  svg.body .hitfill{fill:rgba(224,96,58,.10); opacity:0; transition:.15s;}\n  svg.body.show .hitfill{opacity:1;}\n\n  .ctrl{display:flex; align-items:center; gap:10px; margin-top:4px;}\n  .switch{display:inline-flex; align-items:center; gap:8px; font-size:12.5px; font-weight:600; color:var(--ink2); cursor:pointer; user-select:none;}\n  .switch input{display:none;}\n  .track{width:36px;height:20px;border-radius:999px;background:#D6DCE1;position:relative;transition:.18s;}\n  .track::after{content:\"\";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.18s;}\n  .switch input:checked + .track{background:var(--green);}\n  .switch input:checked + .track::after{transform:translateX(16px);}\n\n  .btns{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}\n  .btn{appearance:none; border:1px solid var(--line); background:#fff; font:inherit; font-size:12.5px; font-weight:700; color:var(--ink); padding:8px 13px; border-radius:10px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:.14s;}\n  .btn:hover{border-color:var(--green); color:var(--green-d);}\n  .btn.solid{background:var(--green-d); border-color:var(--green-d); color:#fff;}\n  .btn.solid:hover{background:#256628; color:#fff;}\n\n  .full{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; margin-bottom:20px;}\n  .full h3{font-size:14.5px; font-weight:800; margin:0 0 10px;}\n  .specrow{display:grid; grid-template-columns:128px 1fr; gap:6px 16px; font-size:13px;}\n  .specrow dt{color:var(--ink3); font-weight:700;}\n  .specrow dd{margin:0; color:var(--ink); }\n  code.t{font-family:ui-monospace,Menlo,monospace; font-size:12px; background:#F1F4F6; padding:1px 5px; border-radius:5px;}\n\n  .codebox{margin-top:12px; background:#1C2228; border-radius:12px; padding:14px 16px; overflow:auto; max-height:340px; position:relative;}\n  .codebox pre{margin:0; font-family:ui-monospace,Menlo,monospace; font-size:11.5px; line-height:1.7; color:#D7DEE5; white-space:pre;}\n  .codebox .cp{position:absolute; top:10px; right:10px;}\n  .k{color:#7FB4E8;} .s{color:#9FCE8A;} .c{color:#6A7682;} .n{color:#E5C07B;}\n\n  #toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(18px); background:#1B2126; color:#fff; font-size:13px; font-weight:600; padding:11px 18px; border-radius:11px; opacity:0; pointer-events:none; transition:.22s; z-index:50;}\n  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"wrap\">\n  <header class=\"top\">\n    <div class=\"lock\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"10\" width=\"16\" height=\"11\" rx=\"2\"><\u002Frect><path d=\"M8 10V7a4 4 0 0 1 8 0v3\"><\u002Fpath><\u002Fsvg>\n    <\u002Fdiv>\n    <div>\n      <h1>체크당 바디맵 · 고정 인체 자산<\u002Fh1>\n      <div class=\"sub\">이 인체 모형은 <b>확정된 자산<\u002Fb>입니다. Claude는 새로 그리지 말고 아래 PNG를 그대로 사용하세요.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div class=\"banner\">\n    <h2>⚠ Claude 지침 — 인체 모형 재디자인 금지<\u002Fh2>\n    <ul>\n      <li><b>인체 그림을 새로 그리거나 SVG로 다시 작도하지 마세요.<\u002Fb> 아래 <b>정면/후면 PNG(투명 배경)<\u002Fb> 를 그대로 자산으로 사용합니다.<\u002Fli>\n      <li>색은 인체 채움 <code class=\"t\">#D0D0D0<\u002Fcode> 고정, 배경 투명. 비율·신장을 임의로 바꾸지 마세요(정면·후면 신장 동일).<\u002Fli>\n      <li>좌표계는 <b>viewBox 0 0 200 400<\u002Fb>. 히트박스(RectF)와 통증 분류는 아래 정의를 그대로 따릅니다.<\u002Fli>\n      <li>레이아웃·카드·인터랙션 UI는 자유롭게 디자인하되, <b>인체 자산과 좌/우 규칙·부위 정의는 변경 불가<\u002Fb>입니다.<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n\n  <div class=\"cards\">\n    <div class=\"card\">\n      <h3>정면 · FRONT <span class=\"meta\">인체 16부위<\u002Fspan><\u002Fh3>\n      <div class=\"stage\"><svg class=\"body\" id=\"svgFront\" viewBox=\"0 0 200 400\"><\u002Fsvg><\u002Fdiv>\n      <div class=\"ctrl\">\n        <label class=\"switch\"><input type=\"checkbox\" class=\"hitToggle\" data-t=\"svgFront\"><span class=\"track\"><\u002Fspan>히트박스 표시<\u002Flabel>\n      <\u002Fdiv>\n      <div class=\"btns\">\n        <button class=\"btn solid\" data-dl=\"front\">⬇ PNG<\u002Fbutton>\n        <button class=\"btn\" data-cpimg=\"front\">data URI 복사<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card\">\n      <h3>후면 · BACK <span class=\"meta\">인체 12부위<\u002Fspan><\u002Fh3>\n      <div class=\"stage\"><svg class=\"body\" id=\"svgBack\" viewBox=\"0 0 200 400\"><\u002Fsvg><\u002Fdiv>\n      <div class=\"ctrl\">\n        <label class=\"switch\"><input type=\"checkbox\" class=\"hitToggle\" data-t=\"svgBack\"><span class=\"track\"><\u002Fspan>히트박스 표시<\u002Flabel>\n      <\u002Fdiv>\n      <div class=\"btns\">\n        <button class=\"btn solid\" data-dl=\"back\">⬇ PNG<\u002Fbutton>\n        <button class=\"btn\" data-cpimg=\"back\">data URI 복사<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"full\">\n    <h3>자산 사양<\u002Fh3>\n    <dl class=\"specrow\">\n      <dt>좌표계<\u002Fdt><dd>viewBox <code class=\"t\">0 0 200 400<\u002Fcode> (가로 200 × 세로 400)<\u002Fdd>\n      <dt>이미지 배치<\u002Fdt><dd><code class=\"t\">x=18.87 · y=-2.04 · w=162.79 · h=403.56<\u002Fcode> · 비례 유지<\u002Fdd>\n      <dt>인체 채움<\u002Fdt><dd><code class=\"t\">#D0D0D0<\u002Fcode> · 배경 투명 · 정면/후면 신장 동일(중심축 정렬)<\u002Fdd>\n      <dt>점등(선택)<\u002Fdt><dd>brand green <code class=\"t\">#4CAF50<\u002Fcode> · <b>인체 실루엣 알파로 마스킹<\u002Fb>(몸 밖 번짐 금지)<\u002Fdd>\n      <dt>좌/우 규칙<\u002Fdt><dd>인체 자신 기준(의학적 관례). 정면: 인체 LEFT=화면 오른쪽(x&gt;100) / 후면: 인체 LEFT=화면 왼쪽(x&lt;100)<\u002Fdd>\n    <\u002Fdl>\n    <div class=\"btns\">\n      <button class=\"btn\" id=\"cpComponent\">재사용 컴포넌트 코드 복사<\u002Fbutton>\n      <button class=\"btn\" id=\"cpHit\">히트박스 좌표(JS) 복사<\u002Fbutton>\n      <button class=\"btn\" id=\"cpKotlin\">히트박스 Kotlin 복사<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"codebox\">\n      <button class=\"btn solid cp\" id=\"cpComponent2\">복사<\u002Fbutton>\n      <pre id=\"snippet\"><\u002Fpre>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"toast\"><\u002Fdiv>\n\n<script src=\"c05a3589-5aa5-4a78-be1b-9390e208f8ad\"><\u002Fscript>\n<script src=\"8781f283-8bcb-4b76-aff1-3ecd0fa86396\"><\u002Fscript>\n<script>\n/* 인체 이미지 + 히트박스 렌더 (자산 미리보기) */\nconst A_SVGNS='http://www.w3.org/2000/svg', A_XLNS='http://www.w3.org/1999/xlink';\nfunction renderAsset(svgId, src, regions){\n  const svg=document.getElementById(svgId);\n  let hits='';\n  regions.forEach(([part,_l,[l,t,r,b]])=>{\n    hits+=`<rect class=\"hitfill\" x=\"${l}\" y=\"${t}\" width=\"${r-l}\" height=\"${b-t}\" rx=\"6\"/>`+\n          `<rect class=\"hitline\" x=\"${l}\" y=\"${t}\" width=\"${r-l}\" height=\"${b-t}\" rx=\"6\"/>`;\n  });\n  svg.innerHTML = `<g class=\"bodyimg\"><\u002Fg><g class=\"hits\">${hits}<\u002Fg>`;\n  const im=document.createElementNS(A_SVGNS,'image');\n  im.setAttribute('href',src); im.setAttributeNS(A_XLNS,'xlink:href',src);\n  im.setAttribute('x',IMG.x); im.setAttribute('y',IMG.y);\n  im.setAttribute('width',IMG.w); im.setAttribute('height',IMG.h);\n  im.setAttribute('preserveAspectRatio','none');\n  svg.querySelector('.bodyimg').appendChild(im);\n}\nrenderAsset('svgFront', IMG_SRC,      FRONT_REGIONS);\nrenderAsset('svgBack',  IMG_SRC_BACK, BACK_REGIONS);\n\ndocument.querySelectorAll('.hitToggle').forEach(t=>\n  t.addEventListener('change',()=>document.getElementById(t.dataset.t).classList.toggle('show',t.checked)));\n\n/* 재사용 컴포넌트 스니펫 */\nconst SNIPPET =\n`<!-- 체크당 바디맵 · 인체 자산 재사용 (이 인체를 새로 그리지 말 것) -->\n<svg id=\"bodymap\" viewBox=\"0 0 200 400\" width=\"200\" height=\"400\">\n  <defs>\n    <!-- 인체 실루엣 알파를 점등 마스크로 사용 -->\n    <mask id=\"bodyMask\" maskUnits=\"userSpaceOnUse\" x=\"0\" y=\"0\" width=\"200\" height=\"400\" style=\"mask-type:alpha\">\n      <image href=\"BODYMAP_IMG\" x=\"18.87\" y=\"-2.04\" width=\"162.79\" height=\"403.56\" preserveAspectRatio=\"none\"/>\n    <\u002Fmask>\n  <\u002Fdefs>\n  <!-- 1) 인체 이미지 (정면=BODYMAP_IMG, 후면=BODYMAP_IMG_BACK 로 교체) -->\n  <image href=\"BODYMAP_IMG\" x=\"18.87\" y=\"-2.04\" width=\"162.79\" height=\"403.56\" preserveAspectRatio=\"none\"/>\n  <!-- 2) 선택 부위 점등: 인체 모양으로만 채워짐 -->\n  <g mask=\"url(#bodyMask)\">\n    <!-- 예: 가슴(CHEST) 선택 -->\n    <rect x=\"78\" y=\"82\" width=\"44\" height=\"68\" rx=\"7\" fill=\"#4CAF50\" fill-opacity=\"0.45\"/>\n  <\u002Fg>\n<\u002Fsvg>\n<!-- BODYMAP_IMG / BODYMAP_IMG_BACK : 첨부된 정면/후면 PNG(data URI). 새로 그리지 말 것 -->`;\n\nfunction hl(s){return s.replace(/&/g,'&amp;').replace(/<\u002Fg,'&lt;')\n  .replace(/(&lt;!--[^]*?--&gt;)/g,'<span class=\"c\">$1<\u002Fspan>');}\ndocument.getElementById('snippet').innerHTML = hl(SNIPPET);\n\n/* copy / download */\nfunction toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1700);}\nfunction copy(text,msg){navigator.clipboard.writeText(text).then(()=>toast(msg)).catch(()=>toast('복사 실패'));}\nfunction dl(href,name){const a=document.createElement('a');a.href=href;a.download=name;document.body.appendChild(a);a.click();a.remove();toast(name+' 다운로드');}\n\ndocument.querySelectorAll('[data-dl]').forEach(b=>b.addEventListener('click',()=>{\n  const back=b.dataset.dl==='back';\n  dl(back?IMG_SRC_BACK:IMG_SRC, back?'bodymap_grey_back.png':'bodymap_grey_front.png');\n}));\ndocument.querySelectorAll('[data-cpimg]').forEach(b=>b.addEventListener('click',()=>{\n  const back=b.dataset.cpimg==='back';\n  copy(back?IMG_SRC_BACK:IMG_SRC, (back?'후면':'정면')+' data URI 복사됨');\n}));\ndocument.getElementById('cpComponent').addEventListener('click',()=>copy(SNIPPET,'재사용 컴포넌트 코드 복사됨'));\ndocument.getElementById('cpComponent2').addEventListener('click',()=>copy(SNIPPET,'재사용 컴포넌트 코드 복사됨'));\ndocument.getElementById('cpKotlin').addEventListener('click',()=>copy(buildKotlinMap(),'히트박스 Kotlin 복사됨'));\ndocument.getElementById('cpHit').addEventListener('click',()=>{\n  const j='const FRONT_REGIONS = '+JSON.stringify(FRONT_REGIONS.map(([p,l,r])=>({part:p,label:l,rect:r})),null,2)+\n    ';\\n\\nconst BACK_REGIONS = '+JSON.stringify(BACK_REGIONS.map(([p,l,r])=>({part:p,label:l,rect:r})),null,2)+';';\n  copy(j,'히트박스 좌표(JS) 복사됨');\n});\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
