spring:
  application:
    name: checkdang

  datasource:
    # RDS 연결 정보: 엔드포인트는 유지하고 한글 인코딩 설정을 추가했습니다.
    url: ${RDS_URL:jdbc:mysql://checkdang-db.c168kuo8whz4.ap-northeast-2.rds.amazonaws.com:3306/checkdang?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
    username: ${RDS_USERNAME}
    password: ${RDS_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI}
google:
  play:
    package-name: ${GOOGLE_PLAY_PACKAGE_NAME}
    service-account-key: ${GOOGLE_PLAY_SERVICE_ACCOUNT_KEY}
    subscription-id: ${GOOGLE_PLAY_SUBSCRIPTION_ID}
    mock-mode: ${GOOGLE_PLAY_MOCK_MODE:false}

kakao:
  pay:
    secret-key: ${KAKAO_PAY_SECRET_KEY}
    cid: ${KAKAO_PAY_CID:TC0ONETIME}
    approval-url: ${KAKAO_PAY_APPROVAL_URL}
    cancel-url: ${KAKAO_PAY_CANCEL_URL}
    fail-url: ${KAKAO_PAY_FAIL_URL}
    premium-price: ${KAKAO_PAY_PREMIUM_PRICE:9900}
    mock-mode: ${KAKAO_PAY_MOCK_MODE:false}

aws:
  region: ${AWS_REGION}
  credentials:
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
  cognito:
    user-pool-id: ${COGNITO_USER_POOL_ID}
    identity-pool-id: ${COGNITO_IDENTITY_POOL_ID}
  dynamodb:
    endpoint: ${DYNAMODB_ENDPOINT:}
    payment-table-name: payment_records

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health

ai:
  server-url: ${AI_SERVER_URL:http://localhost:8000}

predictor:
  server-url: ${PREDICTOR_URL:http://predictor:8000}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}

# FastAPI -> Spring 내부 호출(혈당 알림 트리거) 인증용 공유 키
internal:
  api-key: ${INTERNAL_API_KEY}

# Firebase Cloud Messaging — 저혈당/고혈당 푸시 알림
fcm:
  service-account-key: ${FIREBASE_SERVICE_ACCOUNT_KEY:}